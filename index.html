<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sınıf Proje</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #111827;
      padding: 35px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      max-width: 420px;
    }

    h1 {
      color: #22c55e;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
    }

    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 14px;
      background: #22c55e;
      color: #052e16;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Heisenberg Lab 🧪</h1>
    <p>İlk deploy başarılı kanka.</p>
    <p>Bu sayfa Vercel üzerinden yayında.</p>
    <div class="badge">Sistem çalışıyor</div>
  </div>
</body>
</html>
